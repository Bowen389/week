name: Tencent-only candidate backfill for 2026-11-06
on:
  push:
    branches: [backfill-2026-11-06]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Scan Friday candidates
        run: |
          python -u - <<'PY'
          from datetime import datetime, date, timedelta
          from types import SimpleNamespace
          from src import weekly
          
          class BackfillClock(datetime):
              @classmethod
              def now(cls, tz=None):
                  return cls(2026, 11, 6, 21, 0, tzinfo=tz)
          
          weekly.dt = SimpleNamespace(datetime=BackfillClock, date=date, timedelta=timedelta)
          import json
          import baostock
          from src import tencent

          baostock.login = lambda: SimpleNamespace(error_code='offline', error_msg='use Tencent HTTPS directly')
          original_history = tencent.history
          tencent.history = lambda code, count=400: original_history(code, 90)
          state_file = weekly.ROOT / 'state/account.json'
          state = json.loads(state_file.read_text())
          state['last_day'] = '2026-11-06'
          state_file.write_text(json.dumps(state))
          weekly.run()
          PY
          cat signals/2026-11-06/README.md
      - name: Print scan report
        if: always()
        run: cat signals/2026-11-06/README.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidates-2026-11-06
          path: signals/2026-11-06
